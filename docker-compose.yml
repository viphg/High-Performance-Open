services:
  postgres:
    image: postgres:15-alpine
    container_name: hp-postgres-open
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: high_performance_open
    volumes:
      - postgres_data_open:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hp-redis-open
    ports:
      - "6380:6379"
    volumes:
      - redis_data_open:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hp-backend-open
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/high_performance_open
      REDIS_URL: redis://redis:6379/0
      DEBUG: "True"
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hp-frontend-open
    volumes:
      - ./frontend:/app
      - frontend_node_modules_open:/app/node_modules
    ports:
      - "0.0.0.0:5175:5173"
    environment:
      VITE_API_URL: http://localhost:8001/api
    depends_on:
      - backend

volumes:
  postgres_data_open:
  redis_data_open:
  frontend_node_modules_open:
